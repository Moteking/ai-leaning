name: Daily X post

on:
  schedule:
    # 毎日 00:00 UTC (= 日本時間 09:00) に投稿
    - cron: "0 0 * * *"
  workflow_dispatch: {} # 手動実行も可

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Twitter client
        run: npm install twitter-api-v2@^1.17.0 --no-save
      - name: Post to X
        working-directory: ai-search-checker/automation/social
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        # node_modules はリポジトリ直下にインストールされるため NODE_PATH を通す
        run: NODE_PATH="$GITHUB_WORKSPACE/node_modules" node post-to-x.mjs
