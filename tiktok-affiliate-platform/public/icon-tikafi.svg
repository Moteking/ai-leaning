<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bgIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fe2c55"/>
      <stop offset="50%" stop-color="#ff0050"/>
      <stop offset="100%" stop-color="#25f4ee"/>
    </linearGradient>
    <linearGradient id="accentIcon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#25f4ee"/>
      <stop offset="100%" stop-color="#69f7f2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="220" fill="url(#bgIcon)"/>

  <!-- "T" stylized -->
  <g transform="translate(512, 420)">
    <!-- T vertical bar -->
    <rect x="-55" y="-100" width="110" height="440" rx="55" fill="white"/>
    <!-- T horizontal bar -->
    <rect x="-220" y="-100" width="440" height="110" rx="55" fill="white"/>
    <!-- Music note circle -->
    <circle cx="0" cy="385" r="80" fill="url(#accentIcon)"/>
    <!-- Decorative dot -->
    <circle cx="175" cy="-45" r="32" fill="#25f4ee" opacity="0.85"/>
  </g>
</svg>
